{% extends "base.html" %}

{% block main_content %}
<div class="py-4">
    <h2 class="text-success mb-4 fw-bold">Your Favorites</h2>

    {% if favourites %}
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            {% for product in favourites %}
            <div class="col">
                <div class="card h-100 border-0 shadow-sm">
                    <img src="{{ url_for('static', filename=product['image_filename']) }}"
                         class="card-img-top"
                         alt="{{ product['name'] }}"
                         style="height: 220px; object-fit: cover;">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">{{ product["name"] }}</h5>
                        <p class="text-success fw-bold mb-3">€{{ "%.2f"|format(product["price"]) }}</p>

                        <div class="d-flex gap-2">
                            <a href="{{ url_for('product', product_id=product['product_id']) }}"
                               class="btn btn-outline-success w-100 fw-bold">
                                View
                            </a>
                            <a href="{{ url_for('remove_favorite', product_id=product['product_id']) }}"
                               class="btn btn-outline-danger w-100 fw-bold">
                                Remove
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    {% else %}
        <p class="lead text-secondary">You have no favorites yet.</p>
        <a href="{{ url_for('products') }}" class="btn btn-success fw-bold">Browse Flowers</a>
    {% endif %}
</div>
{% endblock %}
