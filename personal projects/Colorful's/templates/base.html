<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Colorful's</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>


<body class="d-flex flex-column min-vh-100 bg-light">

    <nav class="navbar navbar-expand navbar-dark bg-success shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="{{ url_for('index') }}">
                Colorful's
            </a>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('products') }}">All Flowers</a>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto align-items-center">
                    {% if g.user %}
                        <li class="nav-item me-3">
                            <a class="navbar-text text-white fw-bold text-decoration-none" href="{{ url_for('user_menu') }}">
                                {{ g.user }}
                            </a>
                        </li>
                    {% else %}
                        <li class="nav-item px-1">
                            <a class="btn btn-sm btn-outline-light" href="{{ url_for('auth') }}">Log in</a>
                        </li>
                        <li class="nav-item px-1">
                            <a class="btn btn-sm btn-light text-success fw-bold" href="{{ url_for('auth') }}">Register</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1">
        <div class="row">
            <div class="col-12">
                {% block main_content %}{% endblock %}
            </div>
        </div>
    </main>

    <footer class="bg-white border-top py-4 mt-auto">
        <div class="container text-center text-muted">
            <p class="mb-0">&copy; 2026 CA project - <span class="fw-semibold">Kristiyan Kamenov</span></p>
        </div>
    </footer>

</body>

</html>
